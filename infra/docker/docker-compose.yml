services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379" # for local machine access (optional)
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - urlshort-net

networks:
  urlshort-net:
    name: urlshort-net