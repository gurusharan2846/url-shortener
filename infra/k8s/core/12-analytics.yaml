apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: urlshort
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: urlshort/analytics:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SERVER_PORT
              value: "8082"
          envFrom:
            - configMapRef:
                name: urlshort-config
            - secretRef:
                name: urlshort-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: urlshort
spec:
  selector:
    app: analytics
  ports:
    - name: http
      port: 8082
      targetPort: http
  type: ClusterIP