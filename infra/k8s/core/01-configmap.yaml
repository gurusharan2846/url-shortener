apiVersion: v1
kind: ConfigMap
metadata:
  name: urlshort-config
  namespace: urlshort
data:
  # shared
  SPRING_PROFILES_ACTIVE: "prod"

  CASSANDRA_CONTACTPOINTS: "cassandra-1"   # will exist later as a Service
  CASSANDRA_PORT: "9042"
  CASSANDRA_DATACENTER: "dc1"
  CASSANDRA_KEYSPACE: "urlshortener"

  # redirect-only
  REDIS_HOST: "redis"                      # will exist later as a Service
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"   # will exist later as a Service