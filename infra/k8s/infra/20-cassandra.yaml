---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: urlshort
spec:
  serviceName: cassandra-1-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      terminationGracePeriodSeconds: 180
      containers:
        - name: cassandra
          image: cassandra:4.1
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          ports:
            - { name: cql, containerPort: 9042 }
            - { name: intra, containerPort: 7000 }
            - { name: tls-intra, containerPort: 7001 }
            - { name: jmx, containerPort: 7199 }
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: "url-shortener-cluster"
            - name: CASSANDRA_DC
              value: "dc1"
            - name: CASSANDRA_RACK
              value: "rack1"
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: "GossipingPropertyFileSnitch"
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: CASSANDRA_LISTEN_ADDRESS
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: CASSANDRA_RPC_ADDRESS
              value: "0.0.0.0"
            - name: CASSANDRA_BROADCAST_RPC_ADDRESS
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: MAX_HEAP_SIZE
              value: "384M"
            - name: HEAP_NEWSIZE
              value: "96M"

            # Seeds must be stable pod DNS names via headless service
            - name: CASSANDRA_SEEDS
              value: "cassandra-0.cassandra-1-headless.urlshort.svc.cluster.local"
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  nodetool status | awk 'NR>5 {print $1}' | grep -q '^UN$'
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command: ["/bin/bash","-ec","nodetool drain || true; sleep 10"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: cassandra-hostpath
        resources:
          requests:
            storage: 10Gi

