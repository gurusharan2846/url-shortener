apiVersion: v1
kind: Service
metadata:
  name: cassandra-1-headless
  namespace: urlshort
  labels:
    app: cassandra
spec:
  clusterIP: None
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
    - name: intra
      port: 7000
    - name: tls-intra
      port: 7001
    - name: jmx
      port: 7199

---
apiVersion: v1
kind: Service
metadata:
  name: cassandra-1
  namespace: urlshort
  labels:
    app: cassandra
spec:
  type: ClusterIP
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cassandra-hostpath
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cassandra-pv-0
spec:
  capacity: { storage: 10Gi }
  accessModes: ["ReadWriteOnce"]
  storageClassName: cassandra-hostpath
  persistentVolumeReclaimPolicy: Retain
  hostPath: { path: /mnt/data/cassandra-0 }
  claimRef:
    namespace: urlshort
    name: data-cassandra-0

