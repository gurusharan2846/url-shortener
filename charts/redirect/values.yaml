namespace: urlshort
image:
  repository: ghcr.io/gurusharan2846/urlshort-redirect
  tag: feature-api-service-1b14616
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

config:
  useExistingConfigMap: urlshort-config
  useExistingSecret: urlshort-secrets

probes:
  readiness:
    path: /actuator/health
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 12
  liveness:
    path: /actuator/health
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

ingress:
  enabled: true
  className: nginx
  host: redirect.urlshort.local
  path: /
  pathType: Prefix