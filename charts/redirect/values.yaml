namespace: urlshort
image:
  repository: ghcr.io/gurusharan2846/urlshort-redirect
  tag: feature-api-service-1b14616
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

config:
  useExistingConfigMap: urlshort-config
  useExistingSecret: urlshort-secrets

probes:
  readiness:
    path: /actuator/health
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 12
  liveness:
    path: /actuator/health
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

ingress:
  enabled: true
  className: nginx
  host: redirect.urlshort.local
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 55

hpaBehavior:
  scaleUp:
    stabilizationWindowSeconds: 0
    percent: 100
    periodSeconds: 15
  scaleDown:
    stabilizationWindowSeconds: 60
    percent: 50
    periodSeconds: 30