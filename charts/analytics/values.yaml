namespace: urlshort

image:
  repository: ghcr.io/gurusharan2846/urlshort-analytics
  tag: feature-api-service-1b14616
  pullPolicy: IfNotPresent

replicaCount: 1

serverPort: 8082

service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

config:
  useExistingConfigMap: urlshort-config
  useExistingSecret: urlshort-secrets

probes:
  readiness:
    path: /actuator/health
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 12
  liveness:
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

ingress:
  enabled: false