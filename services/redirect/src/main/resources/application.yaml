server:
  port: 8081
cassandra:
  contactPoints: ${CASSANDRA_CONTACTPOINTS:127.0.0.1}
  port: ${CASSANDRA_PORT:9042}
  datacenter: ${CASSANDRA_DATACENTER:dc1}
  keyspace: ${CASSANDRA_KEYSPACE:urlshortener}
spring:
  application:
    name: redirect
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      properties:
        linger.ms: 5
        batch.size: 16384
app:
  cache:
    ttlSeconds: 3600
    ttlJitterSeconds: 300   # up to +5 minutes random jitter
    prefix: "url:"
  analytics:
    topic: redirect-events

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s
